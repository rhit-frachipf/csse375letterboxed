<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="scripts/storage.js"></script>
  <script type="text/javascript" src="scripts/api.js"></script>
  <script type="text/javascript" src="scripts/ui.js"></script>
  <script type="text/javascript" src="scripts/app.js"></script>
  <script type="text/javascript" src="scripts/scripts.js"></script>
  <link rel="stylesheet" href="styles/styles.css">
  <title>Settings</title>
</head>

<body onload="opensettings()">
  <div class="top-bar">
    <img src="logo.png" width="300" height="55">
  </div>
  <div class="page-spacer"></div>

  <nav class="nav-bar">
    <a class="mymovies" href="mymovies.html">My Movies</a>
    <a class="watchlist" href="watchlist.html">Watchlist</a>
    <a class="search" href="search.html">Search</a>
    <a class="finduser" href="finduser.html">Find a User</a>
    <a class="friends" href="friends.html">Friends</a>
    <a class="signout" href="signin.html">Sign Out</a>
    <a class="settings-nav" href="settings.html" aria-label="Settings">&#9881;</a>
  </nav>

  <main class="page-shell">
    <section class="panel settings-panel">
      <h2>Settings</h2>
      <p id="settingsStatus"></p>

      <h3>Account</h3>
      <label for="settingsUsername">Current Username</label>
      <input id="settingsUsername" type="text" readonly>

      <label for="newUsername">New Username</label>
      <input id="newUsername" type="text" placeholder="Enter new username">
      <label for="currentPasswordForUsername">Current Password</label>
      <div class="password-field-row">
        <input id="currentPasswordForUsername" type="password" placeholder="Enter current password">
        <button id="toggleCurrentPasswordForUsername" type="button" class="secondary-button">Show</button>
      </div>
      <div class="signUpButtonsDiv">
        <button id="updateUsernameButton">Update Username</button>
      </div>
      <p id="usernameStatus"></p>

      <label for="currentPassword">Current Password</label>
      <div class="password-field-row">
        <input id="currentPassword" type="password" placeholder="Enter current password">
        <button id="toggleCurrentPassword" type="button" class="secondary-button">Show</button>
      </div>
      <label for="newPassword">New Password</label>
      <div class="password-field-row">
        <input id="newPassword" type="password" placeholder="Enter new password">
        <button id="toggleNewPassword" type="button" class="secondary-button">Show</button>
      </div>
      <div class="signUpButtonsDiv">
        <button id="updatePasswordButton">Update Password</button>
      </div>
      <p id="passwordStatus"></p>

      <h3>Privacy</h3>
      <div class="settings-checkboxes">
        <label><input id="privacyWatchlist" type="checkbox"> Public watchlist</label>
        <label><input id="privacyRatings" type="checkbox"> Public ratings</label>
        <label><input id="privacyReviews" type="checkbox"> Public reviews</label>
        <label><input id="privacyActivity" type="checkbox"> Public recent activity</label>
      </div>
      <div class="signUpButtonsDiv">
        <button id="savePrivacyButton">Save Privacy Settings</button>
      </div>

      <h3>Appearance</h3>
      <div class="theme-toggle-row">
        <label for="themeToggle">Light mode</label>
        <input id="themeToggle" type="checkbox">
      </div>
      <p id="themeStatus"></p>
    </section>
  </main>
</body>

</html>
