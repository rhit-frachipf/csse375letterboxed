<!doctype html>
<html lang="en">


<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="scripts/storage.js"></script>
  <script type="text/javascript" src="scripts/api.js"></script>
  <script type="text/javascript" src="scripts/ui.js"></script>
  <script type="text/javascript" src="scripts/app.js"></script>
  <script type="text/javascript" src="scripts/scripts.js"></script>
  <link rel="stylesheet" href="styles/styles.css">
  <title>Sign In</title>
</head>

<body onload="openmovie()">
  <div class="top-bar">
    <img src="logo.png" width = "300" height = "55">
  </div>
  <div class="page-spacer"></div>

  <nav class="nav-bar">
    <a class="mymovies" href="mymovies.html">My Movies</a>
    <a class="watchlist" href="watchlist.html">Watchlist</a>
    <a class="search" href="search.html">Search</a>
    <a class="finduser" href="finduser.html">Find a User</a>
    <a class="signout" href="signin.html">Sign Out</a>
  </nav>

  <main class="page-shell">
    <section class="panel">
      <h1 id = "movie-title"></h1>

      <div class="movie-details-layout">
        <img id = "movie-poster" src = "" width = "150" height = "250" alt = "Movie Poster">
        <div class="movie-text-details">
          <p id = "movie-genre"></p>
          <p id = "movie-year"></p>
          <p id = "movie-plot"></p>
        </div>
      </div>

      <button id = "addToList">Toggle on Watchlist</button>

      <div class = "star-container">
        <button class = "image-button" id = "1-star"></button>
        <button class = "image-button" id = "2-star"></button>
        <button class = "image-button" id = "3-star"></button>
        <button class = "image-button" id = "4-star"></button>
        <button class = "image-button" id = "5-star"></button>
      </div>

      <div>
        <label for="written-review">Written review</label>
        <textarea id="written-review" rows="4" cols="50" placeholder="Share your thoughts about this movie"></textarea>
        <button id="saveReview">Save Review</button>
        <p id="review-status"></p>
      </div>
    </section>
  </main>

</body>

</html>
